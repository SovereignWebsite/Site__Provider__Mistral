<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Share card</title>
<!-- The share card source. Not published: tools/shots.mjs renders it to site/assets/share/card-1200x630.jpg. -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#eef3fb;
  background:radial-gradient(circle at 88% 12%,rgba(92,207,197,.35),transparent 42%),radial-gradient(circle at 5% 110%,rgba(120,140,255,.35),transparent 45%),#0d1a2b}
.f{position:absolute;inset:56px 64px;display:flex;flex-direction:column}
.k{font:700 22px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#7fe0d6}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:78px;line-height:1.02;margin-top:30px;letter-spacing:-.01em;max-width:1000px}
.l{display:flex;gap:18px;margin-top:38px}
.l span{font-size:28px;font-weight:700;padding:10px 20px;border:2px solid #7fe0d6;border-radius:999px}
.l span:nth-child(2){border-color:#9fb6ff}.l span:nth-child(3){border-color:#c6a8ff}
.b{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:21px;color:#b9c6d8}
.b strong{color:#eef3fb;font-size:24px}
</style>
</head>
<body>
<div class="f">
  <p class="k">A sovereign website demonstration</p>
  <h1>Mistral, a European brain for a sovereign website</h1>
  <p class="l"><span>On the device</span><span>In the EU</span><span>Any provider</span></p>
  <div class="b"><p><strong>mistral.provider.sovereignweb.site</strong><br>Independent. Not affiliated with or endorsed by Mistral AI.</p><p>Five designs, every fact sourced</p></div>
</div>
</body>
</html>
